# 舊版雲端使用者走勢快照。Local-first 後不再排程執行，僅保留手動備查。
name: Daily Portfolio Snapshot (Manual Legacy)

on:
  workflow_dispatch:

concurrency:
  group: daily-portfolio-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    name: 00:05 投資組合每日快照（結算前一日）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r backend/scripts/requirements.txt
      - name: Verify secrets
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::未設定 SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Run daily portfolio snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python backend/scripts/daily_portfolio_snapshot.py
