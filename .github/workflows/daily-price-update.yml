# 每日 16:00 (台灣時間) 更新股價
# 需在 repo Settings > Secrets 設定 SUPABASE_URL、SUPABASE_SERVICE_ROLE_KEY
name: Daily Price Update
on:
  schedule:
    - cron: '0 8 * * *'  # UTC 08:00 = 台灣 16:00
  workflow_dispatch:  # 允許手動觸發

# 避免排程重複觸發或手動+排程同時執行，導致 previous_date 與 current_date 只差幾秒
concurrency:
  group: daily-price-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r backend/scripts/requirements.txt

      - name: Update exchange rates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::未設定 GitHub Secrets。請到 repo Settings → Secrets and variables → Actions 新增："
            echo "  SUPABASE_URL = https://你的專案.supabase.co"
            echo "  SUPABASE_SERVICE_ROLE_KEY = Supabase Dashboard → Project Settings → API → service_role（點 Reveal）"
            echo "注意：不要用 anon / publishable key，也不要加引號或空白。"
            exit 1
          fi
          # 與本機第二步相同：直接用 service_role 寫入 exchange_rates
          cd backend/scripts && python update_exchange_rates_only.py

      - name: Run daily stock price update
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python backend/scripts/daily_price_update.py
