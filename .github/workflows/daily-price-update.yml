# 股價／匯率排程 — 已改由 Cloud Run + Cloud Scheduler 負責（backend/cloud-run/README.md）
# 定時觸發已停用，避免與 GCP 排程重複寫入 Supabase。
# 需要一次性補跑時：Actions → Daily Price Update → Run workflow
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, FINNHUB_API_KEY, FINMIND_TOKEN
name: Daily Price Update

on:
  workflow_dispatch:

concurrency:
  group: daily-price-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  manual-full:
    name: 手動觸發（close，全市場）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r backend/scripts/requirements.txt
      - name: Verify secrets
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::未設定 SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Full update (close, all markets)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python backend/scripts/daily_price_update.py --mode close
