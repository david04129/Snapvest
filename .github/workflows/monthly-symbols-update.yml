# 每月自動更新美股／台股／加密 symbols 清單（供發 App 新版使用）
# 不需 Secrets；成功後會 commit 至 main
name: Monthly Symbols Update

on:
  schedule:
    # 每月 1 日 02:00 UTC = 台灣時間 10:00
    - cron: '0 2 1 * *'
  workflow_dispatch:

concurrency:
  group: monthly-symbols-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-commit:
    name: 建置 symbols 並 commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build all symbol lists
        working-directory: scripts
        run: ./build_all.sh

      - name: Summary
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          lines = ["## Symbols 更新摘要", ""]
          for name in ("tw", "us", "crypto"):
              p = Path(f"scripts/output/symbols_{name}.json")
              d = json.loads(p.read_text(encoding="utf-8"))
              lines.append(
                  f"- **{p.name}**: version={d.get('version')}, "
                  f"items={len(d.get('items', []))}, updatedAt={d.get('updatedAt')}"
              )
          map_path = Path("backend/scripts/data/crypto_coingecko_map.json")
          if map_path.exists():
              lines.append(f"- **crypto_coingecko_map.json**: {len(json.loads(map_path.read_text()))} 筆")
          text = "\n".join(lines) + "\n"
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              Path(summary_path).write_text(text, encoding="utf-8")
          print(text)
          PY

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            scripts/output/ \
            Snapvest/Snapvest/Resources/Symbols/ \
            backend/scripts/data/crypto_coingecko_map.json

          if git diff --staged --quiet; then
            echo "Symbols 清單無變動，略過 commit。"
            exit 0
          fi

          git commit -m "$(cat <<'EOF'
chore(symbols): 每月自動更新美股／台股／加密清單

由 GitHub Actions 執行 scripts/build_all.sh，同步至 App Bundle 與 crypto_coingecko_map。
EOF
)"
          git push
