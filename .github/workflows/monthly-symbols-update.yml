# 每月自動更新美股／台股／加密 symbols 清單（供發 App 新版使用）
# 不需 Secrets；成功後會 commit 至 main
name: Monthly Symbols Update

on:
  schedule:
    # 每月 1 日 02:00 UTC = 台灣時間 10:00
    - cron: '0 2 1 * *'
  workflow_dispatch:

concurrency:
  group: monthly-symbols-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-commit:
    name: 建置 symbols 並 commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r backend/scripts/requirements.txt

      - name: Build all symbol lists
        working-directory: scripts
        run: ./build_all.sh

      - name: Sync symbol catalog to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/sync_symbol_catalog_to_db.py

      - name: Summary
        run: python3 scripts/print_symbols_summary.py

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            scripts/output/ \
            scripts/output/archive/ \
            Snapvest/Snapvest/Resources/Symbols/ \
            backend/scripts/data/crypto_coingecko_map.json

          if git diff --staged --quiet; then
            echo "Symbols 清單無變動，略過 commit。"
            exit 0
          fi

          git commit -m "chore(symbols): 每月自動更新美股/台股/加密清單"
          git push
